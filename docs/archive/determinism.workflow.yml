name: determinism

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-determinism:
    name: lint-determinism (entropy guard)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint determinism boundary
        run: bun run scripts/lint-determinism.ts

  reproducibility:
    name: byte-identical reproducibility (determinism + composition tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Determinism + composition tests
        run: ./node_modules/.bin/vitest run tests/determinism tests/composition --reporter=default
