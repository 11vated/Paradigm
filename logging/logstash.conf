# ═══════════════════════════════════════════════════════════════════════════
# Paradigm Absolute — Logstash Pipeline Configuration
# Log ingestion, parsing, and forwarding
# ═══════════════════════════════════════════════════════════════════════════

input {
  # Beats input (Filebeat from Kubernetes pods)
  beats {
    port => 5044
    ssl => false
  }
  
  # HTTP input for direct log shipping
  http {
    port => 8080
    codec => json
  }
  
  # TCP input for syslog
  tcp {
    port => 5000
    type => syslog
  }
}

filter {
  # Parse JSON logs
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "parsed"
    }
  }
  
  # Parse Kubernetes metadata
  if [kubernetes] {
    mutate {
      add_field => {
        "k8s_namespace" => "%{[kubernetes][namespace]}"
        "k8s_pod" => "%{[kubernetes][pod][name]}"
        "k8s_container" => "%{[kubernetes][container][name]}"
      }
    }
  }
  
  # Parse application logs
  if [k8s_container] == "paradigm" {
    grok {
      match => {
        "message" => "\[%{TIMESTAMP_ISO8601:timestamp}\] \[%{LOGLEVEL:level}\] \[%{DATA:component}\] %{GREEDYDATA:log_message}"
      }
    }
    
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }
  
  # Parse HTTP access logs
  if [type] == "nginx" or [type] == "access" {
    grok {
      match => {
        "message" => '%{IPORHOST:client_ip} - %{USER:user} \[%{HTTPDATE:timestamp}\] "%{WORD:method} %{URIPATHPARAM:request} HTTP/%{NUMBER:http_version}" %{NUMBER:status_code} %{NUMBER:bytes} "%{DATA:referrer}" "%{DATA:user_agent}"'
      }
    }
    
    geoip {
      source => "client_ip"
      target => "geoip"
    }
    
    useragent {
      source => "user_agent"
      target => "ua"
    }
  }
  
  # Parse error logs
  if [level] == "ERROR" or [level] == "FATAL" {
    mutate {
      add_tag => ["error"]
    }
  }
  
  # Add environment metadata
  mutate {
    add_field => {
      "environment" => "${ENVIRONMENT:production}"
      "cluster" => "${CLUSTER_NAME:paradigm-production}"
    }
  }
  
  # Remove unnecessary fields
  mutate {
    remove_field => ["agent", "ecs", "host", "input"]
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "paradigm-logs-%{+YYYY.MM.dd}"
    user => "${ELASTICSEARCH_USER:elastic}"
    password => "${ELASTICSEARCH_PASSWORD}"
    ssl => false
    
    # Index lifecycle management
    ilm_enabled => true
    ilm_rollover_alias => "paradigm-logs"
    ilm_pattern => "{now/d}-000001"
    ilm_policy => "paradigm-logs-policy"
  }
  
  # Debug output (optional, for development)
  # stdout {
  #   codec => rubydebug
  # }
}

