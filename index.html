<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Browser shim for any code referencing Node 'process' (some server-ish imports leak into client bundle via UI tree)
      // Prevents "process is not defined" runtime error that was causing blank white screen (React failed to mount).
      window.process = window.process || { env: { NODE_ENV: 'development' }, browser: true, versions: {}, cwd: () => '/' };
    </script>
    <title>Paradigm Absolute - Deterministic Synthetic Evolution OS</title>
  </head>
  <body style="background:#050505; color:#f5f5f5; margin:0;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
