# ═══════════════════════════════════════════════════════════════════════════
# Paradigm Absolute — Kubernetes Network Policies
# Pod-to-pod traffic restrictions for security
# ═══════════════════════════════════════════════════════════════════════════

---
# Default deny all ingress traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: paradigm
spec:
  podSelector: {}
  policyTypes:
  - Ingress

---
# Allow ingress from ingress controller to application
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-app
  namespace: paradigm
spec:
  podSelector:
    matchLabels:
      app: paradigm-absolute
      component: api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 3000

---
# Allow application to database
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-database
  namespace: paradigm
spec:
  podSelector:
    matchLabels:
      app: paradigm-absolute
      component: database
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: paradigm-absolute
          component: api
    ports:
    - protocol: TCP
      port: 5432

---
# Allow application to cache
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-cache
  namespace: paradigm
spec:
  podSelector:
    matchLabels:
      app: paradigm-absolute
      component: cache
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: paradigm-absolute
          component: api
    ports:
    - protocol: TCP
      port: 6379

---
# Allow Prometheus to scrape metrics
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scraping
  namespace: paradigm
spec:
  podSelector:
    matchLabels:
      app: paradigm-absolute
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 3000

---
# Allow DNS queries
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: paradigm
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53

---
# Allow egress to internet (for external APIs)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-egress
  namespace: paradigm
spec:
  podSelector:
    matchLabels:
      app: paradigm-absolute
      component: api
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80

