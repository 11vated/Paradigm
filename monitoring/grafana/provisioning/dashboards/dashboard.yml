# ═══════════════════════════════════════════════════════════════════════════
# Paradigm Absolute — Grafana Dashboard Provisioning
# Automatically loads dashboards from JSON files
# ═══════════════════════════════════════════════════════════════════════════

apiVersion: 1

providers:
  - name: 'Paradigm Dashboards'
    orgId: 1
    folder: 'Paradigm'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: true

