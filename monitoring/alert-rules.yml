# ═══════════════════════════════════════════════════════════════════════════
# Paradigm Absolute — Prometheus Alert Rules
# Critical, warning, and info-level alerts
# ═══════════════════════════════════════════════════════════════════════════

groups:
  # ─── Application Alerts ────────────────────────────────────────────────
  - name: paradigm_application
    interval: 30s
    rules:
    # Service Down
    - alert: ParadigmServiceDown
      expr: up{job="paradigm-app"} == 0
      for: 1m
      labels:
        severity: critical
        component: application
      annotations:
        summary: "Paradigm service is down"
        description: "Paradigm application {{ $labels.kubernetes_pod_name }} has been down for more than 1 minute."
    
    # High Error Rate
    - alert: HighErrorRate
      expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
      for: 5m
      labels:
        severity: critical
        component: application
      annotations:
        summary: "High error rate detected"
        description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"
    
    # Slow Response Time
    - alert: SlowResponseTime
      expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 5
      for: 10m
      labels:
        severity: warning
        component: application
      annotations:
        summary: "Slow response time (p95)"
        description: "95th percentile response time is {{ $value }}s (threshold: 5s)"
    
    # High Memory Usage
    - alert: HighMemoryUsage
      expr: (container_memory_usage_bytes{pod=~"paradigm-app.*"} / container_spec_memory_limit_bytes{pod=~"paradigm-app.*"}) > 0.85
      for: 5m
      labels:
        severity: warning
        component: application
      annotations:
        summary: "High memory usage"
        description: "Pod {{ $labels.pod }} memory usage is {{ $value | humanizePercentage }} (threshold: 85%)"
    
    # High CPU Usage
    - alert: HighCPUUsage
      expr: rate(container_cpu_usage_seconds_total{pod=~"paradigm-app.*"}[5m]) > 0.8
      for: 10m
      labels:
        severity: warning
        component: application
      annotations:
        summary: "High CPU usage"
        description: "Pod {{ $labels.pod }} CPU usage is {{ $value | humanizePercentage }} (threshold: 80%)"
    
    # Pod Restart Loop
    - alert: PodRestartLoop
      expr: rate(kube_pod_container_status_restarts_total{pod=~"paradigm-app.*"}[15m]) > 0
      for: 5m
      labels:
        severity: warning
        component: application
      annotations:
        summary: "Pod is restarting frequently"
        description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last 15 minutes"

  # ─── Database Alerts ───────────────────────────────────────────────────
  - name: paradigm_database
    interval: 30s
    rules:
    # Database Down
    - alert: PostgreSQLDown
      expr: up{job="postgres"} == 0
      for: 1m
      labels:
        severity: critical
        component: database
      annotations:
        summary: "PostgreSQL is down"
        description: "PostgreSQL database has been down for more than 1 minute."
    
    # High Connection Count
    - alert: HighDatabaseConnections
      expr: pg_stat_database_numbackends > 80
      for: 5m
      labels:
        severity: warning
        component: database
      annotations:
        summary: "High number of database connections"
        description: "Database has {{ $value }} active connections (threshold: 80)"
    
    # Slow Queries
    - alert: SlowDatabaseQueries
      expr: rate(pg_stat_statements_mean_time_seconds[5m]) > 1
      for: 10m
      labels:
        severity: warning
        component: database
      annotations:
        summary: "Slow database queries detected"
        description: "Average query time is {{ $value }}s (threshold: 1s)"
    
    # Low Disk Space
    - alert: LowDatabaseDiskSpace
      expr: (node_filesystem_avail_bytes{mountpoint="/var/lib/postgresql/data"} / node_filesystem_size_bytes{mountpoint="/var/lib/postgresql/data"}) < 0.1
      for: 5m
      labels:
        severity: critical
        component: database
      annotations:
        summary: "Low disk space on database volume"
        description: "Database disk space is {{ $value | humanizePercentage }} full (threshold: 90%)"
    
    # Replication Lag
    - alert: PostgreSQLReplicationLag
      expr: pg_replication_lag > 30
      for: 5m
      labels:
        severity: warning
        component: database
      annotations:
        summary: "PostgreSQL replication lag"
        description: "Replication lag is {{ $value }}s (threshold: 30s)"

  # ─── Cache Alerts ──────────────────────────────────────────────────────
  - name: paradigm_cache
    interval: 30s
    rules:
    # Redis Down
    - alert: RedisDown
      expr: up{job="redis"} == 0
      for: 1m
      labels:
        severity: critical
        component: cache
      annotations:
        summary: "Redis is down"
        description: "Redis cache has been down for more than 1 minute."
    
    # High Memory Usage
    - alert: RedisHighMemory
      expr: (redis_memory_used_bytes / redis_memory_max_bytes) > 0.9
      for: 5m
      labels:
        severity: warning
        component: cache
      annotations:
        summary: "Redis memory usage is high"
        description: "Redis memory usage is {{ $value | humanizePercentage }} (threshold: 90%)"
    
    # High Eviction Rate
    - alert: RedisHighEvictionRate
      expr: rate(redis_evicted_keys_total[5m]) > 100
      for: 5m
      labels:
        severity: warning
        component: cache
      annotations:
        summary: "High Redis eviction rate"
        description: "Redis is evicting {{ $value }} keys/s (threshold: 100/s)"
    
    # Connection Errors
    - alert: RedisConnectionErrors
      expr: rate(redis_rejected_connections_total[5m]) > 0
      for: 5m
      labels:
        severity: warning
        component: cache
      annotations:
        summary: "Redis connection errors"
        description: "Redis is rejecting connections at {{ $value }}/s"

  # ─── Infrastructure Alerts ─────────────────────────────────────────────
  - name: paradigm_infrastructure
    interval: 30s
    rules:
    # Node Down
    - alert: KubernetesNodeDown
      expr: up{job="kubernetes-nodes"} == 0
      for: 5m
      labels:
        severity: critical
        component: infrastructure
      annotations:
        summary: "Kubernetes node is down"
        description: "Node {{ $labels.node }} has been down for more than 5 minutes."
    
    # High Node CPU
    - alert: HighNodeCPU
      expr: (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) by (instance)) > 0.8
      for: 10m
      labels:
        severity: warning
        component: infrastructure
      annotations:
        summary: "High node CPU usage"
        description: "Node {{ $labels.instance }} CPU usage is {{ $value | humanizePercentage }} (threshold: 80%)"
    
    # High Node Memory
    - alert: HighNodeMemory
      expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.85
      for: 10m
      labels:
        severity: warning
        component: infrastructure
      annotations:
        summary: "High node memory usage"
        description: "Node {{ $labels.instance }} memory usage is {{ $value | humanizePercentage }} (threshold: 85%)"
    
    # Low Node Disk Space
    - alert: LowNodeDiskSpace
      expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|fuse.lxcfs"}) < 0.1
      for: 5m
      labels:
        severity: critical
        component: infrastructure
      annotations:
        summary: "Low disk space on node"
        description: "Node {{ $labels.instance }} disk {{ $labels.device }} is {{ $value | humanizePercentage }} full (threshold: 90%)"
    
    # High Disk I/O
    - alert: HighDiskIO
      expr: rate(node_disk_io_time_seconds_total[5m]) > 0.9
      for: 10m
      labels:
        severity: warning
        component: infrastructure
      annotations:
        summary: "High disk I/O on node"
        description: "Node {{ $labels.instance }} disk I/O is {{ $value | humanizePercentage }} (threshold: 90%)"

  # ─── Business Metrics Alerts ───────────────────────────────────────────
  - name: paradigm_business
    interval: 1m
    rules:
    # Low Seed Generation Rate
    - alert: LowSeedGenerationRate
      expr: rate(paradigm_seeds_generated_total[5m]) < 1
      for: 15m
      labels:
        severity: info
        component: business
      annotations:
        summary: "Low seed generation rate"
        description: "Seed generation rate is {{ $value }}/s (expected: >1/s)"
    
    # High API Error Rate
    - alert: HighAPIErrorRate
      expr: (rate(paradigm_api_requests_total{status=~"5.."}[5m]) / rate(paradigm_api_requests_total[5m])) > 0.01
      for: 5m
      labels:
        severity: warning
        component: business
      annotations:
        summary: "High API error rate"
        description: "API error rate is {{ $value | humanizePercentage }} (threshold: 1%)"
    
    # Queue Backlog
    - alert: HighQueueBacklog
      expr: paradigm_queue_depth > 1000
      for: 10m
      labels:
        severity: warning
        component: business
      annotations:
        summary: "High queue backlog"
        description: "Queue has {{ $value }} pending jobs (threshold: 1000)"

